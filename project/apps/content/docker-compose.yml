services:
  postgres:
    image: postgres:14
    container_name: readme-content-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: readme
      POSTGRES_PASSWORD: readme_password
      POSTGRES_DB: readme_content
    ports:
      - '5433:5432'
    volumes:
      - content-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readme -d readme_content"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: readme-content-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@readme.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '8083:80'
    volumes:
      - content-pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 160s

volumes:
  content-postgres-data:
  content-pgadmin-data:
