services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: readme-notifications-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: readme
      RABBITMQ_DEFAULT_PASS: readme_password
    ports:
      - '5673:5672'
      - '15673:15672'
    volumes:
      - notifications-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_listener", "5672"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: readme-notifications-mailhog
    restart: unless-stopped
    ports:
      - '1026:1025'
      - '8026:8025'
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: readme-notifications-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: readme
      MONGO_INITDB_ROOT_PASSWORD: readme_password
      MONGO_INITDB_DATABASE: readme_notifications
    ports:
      - '27019:27017'
    volumes:
      - notifications-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  notifications-rabbitmq-data:
  notifications-mongo-data:
