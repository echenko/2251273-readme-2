services:
  mongo:
    image: mongo:7
    container_name: readme-users-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: readme
      MONGO_INITDB_ROOT_PASSWORD: readme_password
      MONGO_INITDB_DATABASE: readme_users
    ports:
      - '27018:27017'
    volumes:
      - ./mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.0
    container_name: readme-users-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: readme
      ME_CONFIG_MONGODB_ADMINPASSWORD: readme_password
      ME_CONFIG_MONGODB_URL: mongodb://readme:readme_password@mongo:27017/
      ME_CONFIG_BASICAUTH: 'false'
    ports:
      - '8081:8081'
